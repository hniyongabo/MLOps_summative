# Round-robin load balancer over every "app" container.
# Docker's DNS returns one address per container; nginx reads them at start-up,
# so restart nginx after changing the number of containers.
upstream bean_app {
    server app:7860;
}

server {
    listen 80;
    client_max_body_size 100M;   # same limit as the app, for retraining zips

    location / {
        proxy_pass http://bean_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
}
