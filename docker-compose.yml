# Load-testing setup: N app containers behind an nginx load balancer on http://localhost:8080
#
#   docker compose up -d --build --scale app=1     # then 2, then 3
#   docker compose restart nginx                   # after changing the scale, so nginx sees every container
#
# Each container runs the same image as the Hugging Face deployment (see Dockerfile).
services:
  app:
    build: .
    image: bean-leaf-doctor
    expose:
      - "7860"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./loadtest/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
